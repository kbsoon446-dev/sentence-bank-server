<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Speaking Gap</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/speaking.css" />
</head>
<body>
  <header class="header speakingHero">
    <div>
      <p class="eyebrow">New app · separate from Sentence Bank</p>
      <h1>Speaking Gap</h1>
      <div class="sub">문장을 외우지 말고, 실제로 못 했던 말을 다음에는 바로 꺼내도록 연습합니다.</div>
    </div>
    <a class="btn" href="/">Listening app</a>
  </header>

  <main class="container speakingGrid">
    <section class="card captureCard">
      <h2>+ 방금 못 한 말 저장</h2>
      <label class="field"><div class="label">빠른 메모</div><textarea id="quickNote" rows="3" placeholder="오늘 회의에서 데이터가 아직 부족해서 결론 내리기 이르다고 말하고 싶었음"></textarea></label>
      <label class="field"><div class="label">어떤 상황이었나요?</div><textarea id="situation" rows="2"></textarea></label>
      <label class="field"><div class="label">무슨 말을 하고 싶었나요?</div><textarea id="wantedKo" rows="2"></textarea></label>
      <label class="field"><div class="label">실제로 영어로 어떻게 말했나요? (선택)</div><input id="actualAttempt" /></label>
      <div class="row"><button id="btnDraft" class="btn primary">AI 추천 표현 만들기</button><button id="btnSaveSpeaking" class="btn">내 기본 표현으로 저장</button></div>
      <div id="draft" class="draftBox muted">AI가 기본 문장 1개와 대안 1~2개만 제안합니다.</div>
    </section>

    <section class="card reviewCard">
      <div class="row between"><h2>오늘 복습</h2><button id="btnLoadDue" class="btn">Due 불러오기</button></div>
      <div class="stats" id="speakingStats"></div>
      <div id="reviewPane" class="reviewPane muted">오늘 복습할 말하기 상황을 불러오세요.</div>
      <div class="row"><button id="btnStartReview" class="btn primary">오늘 복습 시작</button><button id="btnHint" class="btn">힌트</button><button id="btnRevealSpeaking" class="btn">Reveal</button></div>
      <div class="row"><button id="btnRecord" class="btn danger">녹음/인식 시작</button><span id="timer" class="badge">0.0s</span></div>
      <label class="field"><div class="label">내 답변(음성인식 또는 직접 입력)</div><textarea id="transcript" rows="2"></textarea></label>
      <div class="row"><button id="btnFeedback" class="btn primary">의미 중심 피드백</button><button id="btnAgain" class="btn">Again</button><button id="btnHard" class="btn">Hard</button><button id="btnGood" class="btn">Good</button><button id="btnEasy" class="btn">Easy</button></div>
      <div id="feedback" class="feedback muted">피드백 후 수정된 문장을 반드시 한 번 더 말하세요.</div>
    </section>

    <section class="card libraryCard">
      <div class="row between"><h2>표현 보관함</h2><select id="speakingSort" class="select"><option value="newest">최신순</option><option value="due">복습 예정순</option><option value="oldest">오래된순</option></select></div>
      <div class="row"><input id="speakingQ" class="search" placeholder="상황 / 표현 검색" /><button id="btnRefreshSpeaking" class="btn">검색</button></div>
      <div id="speakingList" class="list"></div>
    </section>
  </main>
  <script src="/speaking.js"></script>
</body>
</html>
